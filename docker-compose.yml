version: "3.2"
services:
  composer:
    build:
      context: .
      dockerfile: Dockerfile
      target: composer
    volumes:
      - .:/app
    entrypoint: composer
  web:
    image: nginx:latest
    ports:
      - "8080:80"
      - "8081:443"
    volumes:
      - .:/usr/share/nginx/html
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - db
      - maildev
      - redis
      - worker
    env_file:
      - ./.env
  php:
    build:
      context: .
      dockerfile: Dockerfile
      target: php
    volumes:
      - ./:/var/www
    environment:
      - FONTCONFIG_CACHE=/var/cache/fontconfig
      - XDG_CACHE_HOME=/var/cache
    expose:
      - "9000"
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    depends_on:
      - db
      - maildev
      - redis
    volumes:
      - .:/usr/share/nginx/html
      - .:/var/www
  db:
    image: mysql/mysql-server:5.7
    restart: always
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: "yes"
      MYSQL_HOST: ${DB_HOST}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - "mysql-data:/var/lib/mysql"
  maildev:
    image: maildev/maildev
    ports:
      - "1080:1080"
  redis:
    image: redis
    ports:
      - "6379:6379"
volumes:
  mysql-data:
